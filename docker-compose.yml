services:
  postgres:
    image: postgres:16
    container_name: ssdcve-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ssdcve
      POSTGRES_USER: ssdcve
      POSTGRES_PASSWORD: ssdcve_dev_password
    ports:
      - "5432:5432"
    volumes:
      - ssdcve_postgres_data:/var/lib/postgresql/data

  ipfs:
    image: ipfs/kubo:v0.36.0
    container_name: ssdcve-ipfs
    restart: unless-stopped
    ports:
      - "4001:4001"
      - "5001:5001"
      - "8080:8080"
    volumes:
      - ssdcve_ipfs_data:/data/ipfs

  anvil:
    image: ghcr.io/foundry-rs/foundry:stable
    container_name: ssdcve-anvil
    restart: unless-stopped
    entrypoint: ["anvil"]
    command: ["--host", "0.0.0.0", "--state", "/data/state.json"]
    ports:
      - "8545:8545"
    volumes:
      - ssdcve_anvil_data:/data

volumes:
  ssdcve_postgres_data:
  ssdcve_ipfs_data:
  ssdcve_anvil_data: